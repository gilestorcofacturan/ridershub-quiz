<!doctype html>

<html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">  
<title>RidersHub Ultimate Challenge</title>  
<style>  
*{box-sizing:border-box}body{margin:0;background:#062f22;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:14px;min-height:100vh}  
.wrap{width:min(100%,560px)}header{text-align:center;padding:12px 8px 16px}.badge{display:inline-block;background:#f4c400;color:#111;padding:7px 12px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:1px}  
h1{font-size:34px;line-height:1;margin:9px 0 5px}.sub{margin:0;color:#dff4e9;font-weight:700}.top{display:flex;justify-content:space-between;font-weight:900;margin:10px 2px}  
.card{background:#fff;color:#111;border-radius:22px;padding:18px;box-shadow:0 15px 35px #0007}.q{font-size:20px;font-weight:900;line-height:1.3}  
.reveal{height:120px;margin:16px 0;border-radius:15px;background:#edf2ef;display:flex;align-items:center;justify-content:center;overflow:hidden}  
.answer{font-size:30px;font-weight:1000;letter-spacing:2px;text-align:center;transition:.55s;padding:10px}.blur{filter:blur(12px);user-select:none}  
input{width:100%;padding:15px;border:2px solid #ddd;border-radius:12px;font-size:18px;text-align:center}button{width:100%;border:0;border-radius:12px;padding:15px;margin-top:10px;font-size:17px;font-weight:1000;cursor:pointer;background:#f4c400;color:#111}  
.next{display:none;background:#111;color:#fff}.result{min-height:28px;text-align:center;font-weight:900;margin-top:9px}.hint{font-size:13px;color:#666;text-align:center;margin-top:8px}  
.progress{height:8px;background:#ffffff35;border-radius:8px;margin-top:14px;overflow:hidden}.bar{height:100%;width:0;background:#f4c400;transition:.3s}.footer{text-align:center;font-size:12px;color:#bfe3d2;margin:14px 0}  
</style></head><body><div class="wrap"><header><div class="badge">RIDERSHUB • ULTIMATE CHALLENGE</div>  
<h1>HULAAN MO! 🏍️</h1><p class="sub">Para sa mga tunay na Ka-Riders—subukan ang memorya mo!</p></header>  
<div class="top"><span>🏆 Score: <b id="score">0</b></span><span>Question <b id="num">1</b>/15</span></div>  
<div class="card"><div class="q" id="q"></div><div class="reveal"><div id="answer" class="answer blur"></div></div>  
<input id="guess" placeholder="I-type ang sagot..." autocomplete="off"><button id="submit">SUBMIT SAGOT</button>  
<div class="result" id="result"></div><button id="next" class="next">NEXT QUESTION ➜</button><div class="hint" id="hint"></div></div>  
<div class="progress"><div id="bar" class="bar"></div></div><div class="footer">Tamang sagot = automatic reveal 🔓</div></div>  
<script>  
const questions=[{q:"Sa post noong Aug 17, ilang followers ang ipinagpasalamat ng RidersHub?",a:"38K",h:"Makikita sa malaking graphic."},  
{q:"Anong petsa ang post na “Alam mo ba ang Magic word?”",a:"AUG 16",h:"Tingnan ang petsa ng post."},  
{q:"Ilang views ang Magic Word post?",a:"9.2K",h:"Nasa kanang ibaba."},  
{q:"Ano ang dalawang salitang tinukoy bilang “Magic Word”?",a:"MAGIC WORD",h:"Dalawang salita."},  
{q:"Ayon sa Magic Word poster, ano ang dapat maging ugali ng rider?",a:"PASENSYOSO",h:"Naka-highlight sa ibabang paalala."},  
{q:"Sa Aug 15 poster, ano ang dapat gawin kapag pinatawag ka?",a:"SUMUNOD",h:"May malaking paalala tungkol sa appearance."},  
{q:"Ano ang maaaring mangyari kapag hindi um-attend sa Face-to-Face Mandatory Training?",a:"MA-PAUSE ANG ACCOUNT",h:"Nasa notification card."},  
{q:"Saan maaaring mag-walk-in para sa make-up session?",a:"GRAB PARTNER CENTER",h:"Nabanggit sa notification."},  
{q:"Anong channel ang pinagmumulan ng make-up session notification?",a:"SMS",h:"Nasa notification card."},  
{q:"Ilang views ang Aug 15 training/appearance post?",a:"19K",h:"Nasa kanang ibaba."},  
{q:"Ilang likes ang 38K Followers post?",a:"46",h:"Reaction count sa ilalim."},  
{q:"Ilang comments ang 38K Followers post?",a:"12",h:"Comment count sa ilalim."},  
{q:"Ano ang safety tagline sa ibaba ng Aug 15 poster?",a:"RIDE SAFE MGA BOSS",h:"Tatlong salita."},  
{q:"Ano ang pangalan ng community na makikita sa Aug 16 ad?",a:"UGNAYAN COMMUNITY",h:"Nasa card sa ibaba."},  
{q:"Ano ang eksaktong linyang tumutukoy sa account status kapag hindi um-attend?",a:"PANSAMANTALANG NAKA-PAUSE ANG IYONG JOBS",h:"Mas mahaba at mas mahirap ito."}];let i=0,score=0,revealed=false;const $=x=>document.getElementById(x);  
function norm(s){return s.trim().toUpperCase().replace(/\s+/g," ")}  
function load(){let x=questions[i];$("num").textContent=i+1;$("q").textContent=x.q;$("answer").textContent=x.a;$("answer").className="answer blur";  
$("guess").value="";$("guess").disabled=false;$("submit").style.display="block";$("next").style.display="none";$("result").textContent="";  
$("hint").textContent="💡 Hint: "+x.h;$("bar").style.width=(i/questions.length*100)+"%";revealed=false;$("guess").focus()}  
function check(){if(revealed)return;let g=norm($("guess").value),a=norm(questions[i].a);if(!g){$("result").textContent="⚠️ Maglagay muna ng sagot.";return}  
if(g===a){score++;$("score").textContent=score;$("answer").classList.remove("blur");$("result").textContent="🎉 TAMA! REVEALED!";$("result").style.color="#08783f";  
$("guess").disabled=true;$("submit").style.display="none";$("next").style.display="block";$("bar").style.width=((i+1)/questions.length*100)+"%";revealed=true}  
else{$("result").textContent="❌ MALI! Subukan ulit.";$("result").style.color="#c62828"}}  
$("submit").onclick=check;$("guess").addEventListener("keydown",e=>{if(e.key==="Enter")check()});  
$("next").onclick=()=>{i++;if(i<questions.length)load();else{$("q").textContent="🎊 CHALLENGE COMPLETE!";$("answer").textContent=score+" / "+questions.length;$("answer").classList.remove("blur");  
$("guess").style.display="none";$("submit").style.display="none";$("next").style.display="none";$("hint").textContent=score===questions.length?"🔥 PERFECT! Kabisa mo ang RidersHub!":"👏 Good job! Subukan ulit para mas mataas ang score.";$("bar").style.width="100%"}};  
load();  
</script></body></html>
