<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCRA Member Website</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div>
      <h1>GCRA</h1>
      <p>Member Management System</p>
    </div>

    <div class="role-area">
      <span id="roleBadge" class="badge">VIEW ONLY</span>

      <select id="role">
        <option value="member">Member</option>
        <option value="admin">Authorized Admin</option>
        <option value="owner">Owner</option>
      </select>
    </div>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>GCRA Members</h2>
      <p>Member directory and verification system</p>
    </section>

    <section class="toolbar">

      <input
        type="search"
        id="search"
        placeholder="Search member, ID, location..."
      >

      <button id="addBtn" class="primary">
        + Add Member
      </button>

    </section>

    <section class="card">

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Member ID</th>
              <th>Name</th>
              <th>Location</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="memberRows"></tbody>

        </table>

      </div>

      <div id="empty" class="empty hidden">
        No members found.
      </div>

    </section>

  </main>


  <!-- ADD / EDIT MEMBER -->

  <dialog id="memberDialog">

    <form id="memberForm" method="dialog">

      <h2 id="dialogTitle">Add Member</h2>

      <input type="hidden" id="memberIndex">

      <label>
        GCRA Member ID
        <input
          type="text"
          id="memberId"
          placeholder="GCRA-004"
          required
        >
      </label>

      <label>
        Full Name
        <input
          type="text"
          id="name"
          placeholder="Member name"
          required
        >
      </label>

      <label>
        Location
        <input
          type="text"
          id="location"
          placeholder="Cavite"
        >
      </label>

      <label>
        Status
        <select id="status">
          <option value="Active">Active</option>
          <option value="Pending">Pending</option>
          <option value="Inactive">Inactive</option>
        </select>
      </label>

      <div class="dialog-actions">

        <button
          type="button"
          onclick="document.getElementById('memberDialog').close()"
        >
          Cancel
        </button>

        <button type="submit" class="primary">
          Save Member
        </button>

      </div>

    </form>

  </dialog>


  <footer>
    <p>GCRA • Member Website</p>
  </footer>


  <script src="app.js"></script>

</body>
</html>
